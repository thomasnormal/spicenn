[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-local-computer"
version = "0.1.0"
description = "SPICE and PyTorch simulator for stochastic local neural hardware."
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "scikit-learn",
  "networkx",
  "torch",
  "torchvision",
  "optuna",
  "PySpice>=1.5",
]

[tool.setuptools.packages.find]
include = ["sim*", "spicenn*"]
